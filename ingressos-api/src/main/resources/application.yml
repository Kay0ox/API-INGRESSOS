server:
  port: 8080

spring:
  application:
    name: ingressos-api

  # ====== Configuração para PostgreSQL (padrão) ======
  datasource:
    url: jdbc:postgresql://localhost:5432/ingressos_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ====== Configuração alternativa para MySQL ======
  # Para usar MySQL: comente o bloco "datasource"/"jpa" acima e descomente o bloco abaixo.
  #
  # datasource:
  #   url: jdbc:mysql://localhost:3306/ingressos_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
  #   username: ${DB_USERNAME:root}
  #   password: ${DB_PASSWORD:root}
  #   driver-class-name: com.mysql.cj.jdbc.Driver
  #
  # jpa:
  #   hibernate:
  #     ddl-auto: update
  #   show-sql: true
  #   properties:
  #     hibernate:
  #       format_sql: true
  #       dialect: org.hibernate.dialect.MySQL8Dialect

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

jwt:
  # Em produção, defina a variável de ambiente JWT_SECRET com uma chave forte (>= 32 caracteres).
  secret: ${JWT_SECRET:troque-esta-chave-secreta-por-uma-chave-segura-em-producao-2026}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    org.springframework.security: INFO
